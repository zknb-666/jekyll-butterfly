<footer id="footer">
  <div class="footer-other">
    <div class="footer-copyright">
      <span class="copyright">&copy; {{ site.data.butterfly.site_start_year }} - {{ site.time | date: '%Y' }} By {{ site.author.name | default: site.title }}</span>
      <span class="framework-info">
        <span>{{ site.data.languages[site.lang].footer.framework }} </span><a target="_blank" rel="noopener" href="https://jekyllrb.com">Jekyll</a>
        <span class="footer-separator">|</span>
        <span>{{ site.data.languages[site.lang].footer.theme }} </span><a target="_blank" rel="noopener" href="https://github.com/jerryc127/hexo-theme-butterfly">Butterfly {{ site.data.butterfly.theme_version }}</a>
      </span>
    </div>
  </div>
</footer>
