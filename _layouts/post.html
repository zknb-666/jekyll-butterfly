---
layout: default
page_type: post
body_class: post
---

<div id="post">
  <article class="container post-content" id="article-container">
    {{ content }}
  </article>

  <nav class="pagination-post" id="pagination">
    {% if page.previous.url %}
    <a class="prev-post pull-left" href="{{ page.previous.url | relative_url }}" title="{{ page.previous.title }}">
      <i class="fas fa-chevron-left"></i> {{ page.previous.title }}
    </a>
    {% endif %}
    {% if page.next.url %}
    <a class="next-post pull-right" href="{{ page.next.url | relative_url }}" title="{{ page.next.title }}">
      {{ page.next.title }} <i class="fas fa-chevron-right"></i>
    </a>
    {% endif %}
  </nav>
</div>
